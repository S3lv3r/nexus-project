<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración — Nexus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-shell-root"></div>

<script src="js/app.js"></script>
<script src="js/mentor.js"></script>
<script>
  const SETTINGS_SECTIONS = [
    { icon: "👤", title: "Cuenta", desc: "Nombre, usuario, correo y datos básicos." },
    { icon: "🔒", title: "Seguridad", desc: "Contraseña y verificación en dos pasos." },
    { icon: "🎨", title: "Apariencia", desc: "Tema y color — ir a Personalización.", link: "personalizacion.html" },
    { icon: "🔔", title: "Notificaciones", desc: "Misiones, logros, racha y comunidad." },
    { icon: "🔐", title: "Privacidad", desc: "Qué información de tu perfil es visible para otros." },
    { icon: "⚙️", title: "Preferencias", desc: "Estilo de aprendizaje y metas — definidas en el onboarding." },
    { icon: "🧭", title: "Intereses", desc: "Editar tus categorías activas.", link: "explorar.html" },
  ];

  const user = initShell("configuracion.html", { requireAuth: true });
  if(user){
    const content = document.getElementById("page-content");
    content.innerHTML = `
      <h1>⚙️ Configuración</h1>
      <div class="card-grid mt-16">
        ${SETTINGS_SECTIONS.map(s => `
          <div class="card">
            <div style="font-size:1.4rem">${s.icon}</div>
            <h3>${s.title}</h3>
            <p>${s.desc}</p>
            ${s.link ? `<a href="${s.link}" class="btn btn-sm">Ir</a>` : `<span class="badge">Próximamente</span>`}
          </div>`).join("")}
      </div>

      <div class="card mt-24">
        <h3>Cuenta</h3>
        <div class="field"><label>Nombre</label><input type="text" id="cfg-name" value="${user.name || ""}"></div>
        <div class="field"><label>Correo</label><input type="email" id="cfg-email" value="${user.email || ""}"></div>
        <button class="btn btn-primary" id="cfg-save">Guardar cambios</button>
      </div>

      <div class="card mt-16">
        <button class="btn btn-danger" onclick="doLogout()">Cerrar sesión</button>
      </div>
    `;

    document.getElementById("cfg-save").onclick = () => {
      user.name = document.getElementById("cfg-name").value.trim();
      user.email = document.getElementById("cfg-email").value.trim();
      saveUser(user);
      toast("Cambios guardados.");
    };
  }
</script>
</body>
</html>
